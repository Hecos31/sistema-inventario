name: Ejecución Automatizada de Pruebas (TEST)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ejecutar-pruebas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ejecutar pruebas unitarias con unittest
        run: python -m unittest discover -s tests -v